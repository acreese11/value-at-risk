### Project metadata
[project]
name = "value-at-risk"
version = "0.1.0"
description = "Databricks-based value-at-risk demo using Delta Lake, MLflow, and alternative data."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE.md" }
authors = [
  { name = "Databricks, Inc." }
]
dependencies = [
  "yfinance>=0.1.70",
  "dbl-tempo>=0.1.18",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "numpy",
  "pandas",
  "pyspark",
  "mlflow",
  "matplotlib",
  "databricks-connect>=15.1",
  "ipykernel",
]

[project.urls]
Homepage = "https://github.com/databricks-industry-solutions/value-at-risk"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["tests_*.py", "test_*.py"]

